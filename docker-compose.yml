services:
  postgres:
    image: postgres:16
    container_name: alma-intra-postgres
    environment:
      POSTGRES_USER: intra_admin
      POSTGRES_PASSWORD: intra_admin
      POSTGRES_DB: alma_intra
    ports:
      # 5434 on the host: 5432 is usually a local Postgres, 5433 is Alma ADOS's.
      - '5434:5432'
    volumes:
      - alma_intra_pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intra_admin -d alma_intra']
      interval: 5s
      timeout: 3s
      retries: 10
  # Object storage for the Files module, S3 like Hetzner Object Storage in production. SeaweedFS's
  # S3 gateway: MinIO's images are no longer published. The credentials in the mounted file are
  # for local use only; the API creates its bucket on start in development (storage.ts).
  # 8333 on loopback only.
  s3:
    image: chrislusf/seaweedfs:3.97
    container_name: alma-intra-s3
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - alma_intra_s3:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  alma_intra_pgdata:
  alma_intra_s3:
