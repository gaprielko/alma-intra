name: E2E staging

# ALMA-102: the Playwright flows against staging once the push to main is what staging serves.
# Coolify deploys every push to main on its own; this waits until /health reports the commit
# (Coolify's runtime SOURCE_COMMIT) and then runs. By hand: Actions → E2E staging → Run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces the run that waits for an older deploy.
concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ vars.E2E_STAGING_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Check the staging configuration
        run: |
          missing=""
          [ -n "$E2E_BASE_URL" ] || missing="$missing variable E2E_STAGING_URL,"
          [ -n "$E2E_EMAIL" ] || missing="$missing secret E2E_EMAIL,"
          [ -n "$E2E_PASSWORD" ] || missing="$missing secret E2E_PASSWORD,"
          if [ -n "$missing" ]; then echo "::error::missing${missing%,} (see docs/runbook.md, E2E tests)"; exit 1; fi
      - name: Wait for staging to serve ${{ github.sha }}
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 60); do
            commit=$(curl -fsS --max-time 10 "$E2E_BASE_URL/health" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "staging serves $commit"; exit 0; fi
            echo "staging serves '${commit:-?}', waiting ($attempt/60)"
            sleep 15
          done
          echo "::error::staging did not serve $GITHUB_SHA within 15 minutes (failed deploy, or SOURCE_COMMIT missing at runtime)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alma/shared build
      - run: pnpm --filter @alma/web exec playwright install --with-deps chromium
      # Only the login flow on staging (decided 22. 9.): the onboarding flow would leave a test
      # patient behind on every deploy. The full set runs in CI (`e2e` in ci.yml).
      - run: pnpm --filter @alma/web exec playwright test login
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-staging
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
