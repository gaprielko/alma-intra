name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to a commit; Dependabot proposes the updates.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Testcontainers needs Docker, available on ubuntu-latest by default.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Generated suite (ADR-009): every tenant table and every orgProcedure, own check on purpose.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tenant

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright against the local target (ALMA-102): the built API serving the built web, like the
    # staging image, on a fresh database with the shared seed. Its own check, like tenant-isolation.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alma_admin
          POSTGRES_PASSWORD: alma_admin
          POSTGRES_DB: alma
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U alma_admin -d alma" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The roles docker-compose creates from apps/api/db/init; the runtime role has no BYPASSRLS.
      - run: psql postgres://alma_admin:alma_admin@localhost:5433/alma -f apps/api/db/init/01-roles.sql
      # The example environment with a throwaway encryption key; no S3, no mail provider.
      - run: |
          sed -e "s|^DATA_ENCRYPTION_KEY=.*|DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)|" \
              -e 's|^S3_[A-Z_]*=.*||' .env.example > .env
      - run: pnpm --filter @alma/shared build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # Built here, not inside Playwright's web server, so a build error shows in the log.
      - run: pnpm turbo run build --filter=@alma/api --filter=@alma/web
      - run: pnpm --filter @alma/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
