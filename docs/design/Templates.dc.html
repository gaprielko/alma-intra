<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>E-mailové šablóny</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#152b2a;-webkit-font-smoothing:antialiased}
a{color:#0a6466;text-decoration:none}a:hover{color:#0c3b3c;text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;height:40px;padding:0 16px;font-size:14px}
.btn:hover{text-decoration:none}
.btn-primary{background:linear-gradient(180deg,#139698 0%,#0b6e70 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(12,59,60,.06),0 4px 12px rgba(12,59,60,.07)}
.btn-primary:hover{color:#fff}
.btn-secondary{background:#e3f3f2;color:#0a6466}
.btn-icon{width:36px;height:36px;padding:0;border:1px solid #d6e1de;background:#fff;color:#48625f}
.search{display:flex;align-items:center;gap:8px;height:40px;min-width:200px;padding:0 12px;border:1px solid #d6e1de;border-radius:10px;background:#fff;color:#6f8784;font-size:14px;box-sizing:border-box}
.kbd{margin-left:auto;font-size:11px;font-weight:600;color:#48625f;border:1px solid #d6e1de;border-radius:6px;padding:1px 6px;background:#f7faf9}
.tab{height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;color:#48625f;display:inline-flex;align-items:center;gap:6px}
.tab-on{background:#e3f3f2;color:#0a6466}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#0f8b8d;color:#fff;font-size:11px;font-weight:700;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #d6e1de;border-radius:999px;background:#fff;font:inherit;font-size:13px;font-weight:500;color:#152b2a;cursor:pointer;white-space:nowrap}
.chip-on{border-color:#0f8b8d;background:#e3f3f2;color:#0a6466;font-weight:600}
.tcard{border:1px solid #dfe8e6;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(12,59,60,.08),0 8px 22px rgba(12,59,60,.08);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:#152b2a}
.tcard:hover{text-decoration:none;box-shadow:0 2px 4px rgba(12,59,60,.08),0 12px 28px rgba(12,59,60,.12)}
.thumb{height:150px;background:#f4f6f6;padding:16px 28px 0;box-sizing:border-box;overflow:hidden}
.mail{background:#fff;border-radius:8px 8px 0 0;height:100%;overflow:hidden;box-shadow:0 1px 3px rgba(12,59,60,.08)}
.ln{height:6px;border-radius:3px;background:#e5eaea;margin:7px 14px 0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #eaf0ee">
  <div style="flex: 0 0 232px; background: #0c3b3c">
    <dc-import name="Sidebar" active="emails" hint-size="232px,900px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0">
    <header style="min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 28px; box-sizing: border-box; background: rgba(255,255,255,0.8); border-bottom: 1px solid #d6e1de">
      <div style="flex: 1 1 auto; min-width: 0">
        <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">E-maily</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: #48625f">Odosielané z info@mail.adosalma.sk</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <div class="search"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Hľadať<span class="kbd">Ctrl K</span></div>
        <a href="SendRecipients.dc.html" class="btn btn-primary"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>Nový e-mail</a>
      </div>
    </header>

    <div style="padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1400px">
      <nav aria-label="Sekcie e-mailov" style="display: flex; flex-wrap: wrap; gap: 6px">
        <a href="#" class="tab">Prijaté <span class="count">2</span></a>
        <a href="Campaign.dc.html" class="tab">Odoslané</a>
        <a href="#" class="tab">Naplánované a koncepty</a>
        <a href="Templates.dc.html" class="tab tab-on" aria-current="page">Šablóny</a>
      </nav>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto">
          <button type="button" class="chip chip-on">Všetky · 6</button>
          <button type="button" class="chip">Ponuky · 2</button>
          <button type="button" class="chip">Novinky · 1</button>
          <button type="button" class="chip">Pozvánky · 1</button>
          <button type="button" class="chip">Follow-up · 2</button>
          <button type="button" class="chip">Neaktívne · 1</button>
        </div>
        <a href="TemplateEditor.dc.html" class="btn btn-secondary"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nová šablóna</a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
        <sc-for list="{{templates}}" as="t" hint-placeholder-count="6">
          <a href="TemplateEditor.dc.html" class="tcard" style="{{t.cardStyle}}">
            <div class="thumb" aria-hidden="true">
              <div class="mail">
                <div style="height: 22px; background: {{t.header}}"></div>
                <div class="ln" style="width: 40%; margin-top: 12px"></div>
                <div class="ln" style="width: 82%"></div>
                <div class="ln" style="width: 70%"></div>
                <div style="height: 28px; margin: 10px 14px 0; border-radius: 5px; background: #f0f8f7"></div>
                <div style="width: 70px; height: 14px; margin: 10px 14px 0; border-radius: 4px; background: #0f766e"></div>
              </div>
            </div>
            <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; gap: 8px">
                <span class="badge" style="{{t.catStyle}}">{{t.category}}</span>
                <sc-if value="{{t.inactive}}" hint-placeholder-val="{{ false }}"><span class="badge" style="background: #dde6e3; color: #48625f">Neaktívna</span></sc-if>
              </div>
              <p style="margin: 0; font-size: 16px; font-weight: 700">{{t.name}}</p>
              <p style="margin: 0; font-size: 13px; color: #48625f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.subject}}</p>
              <p style="margin: 4px 0 0; font-size: 12px; color: #48625f">{{t.meta}}</p>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cats = {
      'Ponuka': 'background:#fcf0de;color:#b45309', 'Novinky': 'background:#e9eef6;color:#334e7b',
      'Pozvánka': 'background:#eeedfe;color:#3c3489', 'Follow-up': 'background:#e3f3f2;color:#0a6466'
    };
    const templates = [
      ['Cenová ponuka 2027', 'Ponuka', 'Cenová ponuka Alma na rok 2027 pre {Názov zákazníka}', 'Upravila Jana Horváthová 25. 10. · odoslaná 14-krát', false, 'linear-gradient(135deg,#104b4c,#0c3b3c)'],
      ['Novinky v Alme', 'Novinky', 'Čo je nové v Alme: október 2026', 'Upravila Lucia Bartošová 20. 10. · odoslaná 3-krát', false, 'linear-gradient(135deg,#104b4c,#0c3b3c)'],
      ['Pozvánka na webinár', 'Pozvánka', 'Pozývame vás na webinár o plánovaní návštev', 'Upravil Peter Kováč 12. 10. · odoslaná 2-krát', false, '#0d7f81'],
      ['Poďakovanie po stretnutí', 'Follow-up', '{Oslovenie}, ďakujeme za stretnutie', 'Upravil Peter Kováč 3. 10. · odoslaná 21-krát', false, 'linear-gradient(135deg,#104b4c,#0c3b3c)'],
      ['Pilot pre nové ADOS', 'Ponuka', 'Vyskúšajte Almu tri mesiace bez poplatku', 'Upravila Jana Horváthová 9. 9. · odoslaná 38-krát', false, 'linear-gradient(135deg,#104b4c,#0c3b3c)'],
      ['Pripomienka obnovenia licencie', 'Follow-up', 'Vaša licencia Alma končí {Platnosť licencie}', 'Upravila Jana Horváthová 2. 6. · odoslaná 9-krát', true, '#c5d3d1']
    ].map((t) => ({
      name: t[0], category: t[1], catStyle: cats[t[1]], subject: t[2], meta: t[3], inactive: t[4], header: t[5],
      cardStyle: t[4] ? 'opacity:.72' : ''
    }));
    return { templates };
  }
}
</script>
</body>
</html>
