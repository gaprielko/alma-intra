<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Upraviť kontakt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#152b2a;-webkit-font-smoothing:antialiased}
a{color:#0a6466;text-decoration:none}a:hover{color:#0c3b3c;text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:linear-gradient(180deg,#139698 0%,#0b6e70 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(12,59,60,.06),0 4px 12px rgba(12,59,60,.07)}
.btn-ghost{background:transparent;color:#0a6466}
.field{position:relative;display:block;border:1px solid #d6e1de;border-radius:12px;background:#fff;min-height:56px;box-sizing:border-box;padding:8px 14px 6px}
.field span{display:block;font-size:12px;font-weight:500;color:#48625f;line-height:16px}
.field input,.field textarea{display:block;width:100%;border:0;outline:0;font:inherit;font-size:15px;color:#152b2a;background:transparent;padding:2px 0 0;resize:none}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:#dde6e3;gap:2px}
.seg button{height:30px;padding:0 14px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#48625f;cursor:pointer}
.seg .on{background:#fff;color:#152b2a;box-shadow:0 1px 2px rgba(12,59,60,.12)}
.switch{position:relative;width:40px;height:24px;border-radius:999px;background:#0f8b8d;flex-shrink:0;border:0;cursor:pointer;padding:0}
.switch i{position:absolute;top:3px;left:19px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.skel{background:#dde6e3;border-radius:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #dfe8e6;border-radius:12px}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #eaf0ee; position: relative">
  <div style="flex: 0 0 232px; background: #0c3b3c">
    <dc-import name="Sidebar" active="customers" hint-size="232px,900px"></dc-import>
  </div>
  <main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 28px; box-sizing: border-box; display: flex; gap: 20px">
    <div style="flex: 2; display: flex; flex-direction: column; gap: 20px">
      <div class="skel" style="width: 280px; height: 28px"></div>
      <div style="border-radius: 16px; background: #fff; height: 300px"></div>
      <div style="border-radius: 16px; background: #fff; height: 420px"></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding-top: 48px">
      <div style="border-radius: 16px; background: #fff; height: 340px"></div>
    </div>
  </main>
  <div style="position: absolute; inset: 0; background: rgba(12,43,44,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <section role="dialog" aria-modal="true" aria-labelledby="contact-title" style="width: 100%; max-width: 600px; border-radius: 20px; background: #fff; box-shadow: 0 1px 3px rgba(12,59,60,0.06), 0 24px 60px rgba(12,43,44,0.28)">
      <header style="display: flex; align-items: flex-start; gap: 12px; padding: 24px 24px 0">
        <div style="flex: 1">
          <h2 id="contact-title" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 700">Upraviť kontakt</h2>
          <p style="margin: 4px 0 0; font-size: 14px; color: #48625f">ADOS Harmónia, s.r.o.</p>
        </div>
        <button type="button" aria-label="Zavrieť" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #48625f; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </header>
      <form style="padding: 20px 24px 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
        <label class="field" style="grid-column: span 1"><span>Titul</span><input value="Mgr."></label>
        <label class="field" style="grid-column: span 2"><span>Meno</span><input value="Eva"></label>
        <label class="field" style="grid-column: span 2"><span>Priezvisko</span><input value="Tóthová"></label>
        <label class="field" style="grid-column: span 1"><span>Titul za</span><input value=""></label>
        <label class="field" style="grid-column: span 3"><span>Pozícia</span><input value="Riaditeľka"></label>
        <div style="grid-column: span 3; display: flex; align-items: center; gap: 12px">
          <span id="c-form" style="font-size: 13px; font-weight: 500; color: #48625f">Oslovovať</span>
          <div class="seg" role="radiogroup" aria-labelledby="c-form"><button type="button" role="radio" aria-checked="false">pán</button><button type="button" role="radio" aria-checked="true" class="on">pani</button></div>
        </div>
        <label class="field" style="grid-column: span 3"><span>E-mail</span><input type="email" value="eva.tothova@adosharmonia.sk"></label>
        <label class="field" style="grid-column: span 3"><span>Telefón</span><input type="tel" value="+421 905 222 314"></label>
        <div style="grid-column: 1 / -1">
          <label class="field"><span>Oslovenie v e-mailoch</span><input value="Vážená pani riaditeľka"></label>
          <p style="margin: 6px 2px 0; font-size: 12px; color: #48625f">Ukážka: „Vážená pani riaditeľka, ďakujeme za záujem…“</p>
        </div>
        <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px">
          <label class="opt">
            <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0f8b8d; margin: 0">
            <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 600">Hlavný kontakt</span><span style="display: block; font-size: 13px; color: #48625f">Predvolený adresát e-mailov tomuto zákazníkovi.</span></span>
          </label>
          <div class="opt">
            <span style="flex: 1"><span id="subs" style="display: block; font-size: 14px; font-weight: 600">Dostáva hromadné e-maily</span><span style="display: block; font-size: 13px; color: #48625f">Vypnite, ak kontakt nechce dostávať ponuky a novinky. Osobné odpovede dostane vždy.</span></span>
            <button type="button" class="switch" role="switch" aria-checked="true" aria-labelledby="subs"><i></i></button>
          </div>
        </div>
        <label class="field" style="grid-column: 1 / -1; min-height: 84px"><span>Poznámka</span><textarea rows="2">Najlepšie sa jej volá dopoludnia.</textarea></label>
      </form>
      <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 20px 24px 24px">
        <button type="button" class="btn btn-ghost" style="color: #dc2626; padding: 0 10px; margin-right: auto">Odstrániť kontakt</button>
        <a href="CustomerDetail.dc.html" class="btn btn-ghost">Zrušiť</a>
        <a href="CustomerDetail.dc.html" class="btn btn-primary">Uložiť</a>
      </footer>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
