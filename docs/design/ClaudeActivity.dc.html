<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Záznam aktivít</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#152b2a;-webkit-font-smoothing:antialiased}
a{color:#0a6466;text-decoration:none}a:hover{color:#0c3b3c;text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;height:40px;padding:0 16px;font-size:14px}
.btn-secondary{background:#e3f3f2;color:#0a6466}
.card{border:1px solid #dfe8e6;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(12,59,60,.08),0 8px 22px rgba(12,59,60,.08)}
.tab{height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;color:#48625f;display:inline-flex;align-items:center}
.tab-on{background:#e3f3f2;color:#0a6466}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #d6e1de;border-radius:999px;background:#fff;font:inherit;font-size:13px;font-weight:500;color:#152b2a;cursor:pointer;white-space:nowrap}
.chip-on{border-color:#0f8b8d;background:#e3f3f2;color:#0a6466;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
th{height:44px;padding:0 16px;background:#f7faf9;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#6f8784;white-space:nowrap}
td{height:52px;padding:8px 16px;border-top:1px solid #dfe8e6;vertical-align:middle}
th:first-child,td:first-child{padding-left:20px}
.claude{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.claude i{width:22px;height:22px;border-radius:6px;background:#fcf0de;color:#b45309;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #eaf0ee">
  <div style="flex: 0 0 232px; background: #0c3b3c">
    <dc-import name="Sidebar" active="settings" hint-size="232px,900px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0">
    <header style="min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 28px; box-sizing: border-box; background: rgba(255,255,255,0.8); border-bottom: 1px solid #d6e1de">
      <div style="flex: 1 1 auto; min-width: 0">
        <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">Nastavenia</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: #48625f">Firma, používatelia a číselníky</p>
      </div>
      <button type="button" class="btn btn-secondary">Exportovať CSV</button>
    </header>
    <div style="padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1400px">
      <nav aria-label="Sekcie nastavení" style="display: flex; flex-wrap: wrap; gap: 6px">
        <a href="#" class="tab">Firma</a>
        <a href="Users.dc.html" class="tab">Používatelia</a>
        <a href="CodeLists.dc.html" class="tab">Číselníky</a>
        <a href="EmailLook.dc.html" class="tab">Vzhľad e-mailov</a>
        <a href="ClaudeActivity.dc.html" class="tab tab-on" aria-current="page">Záznam aktivít</a>
      </nav>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" class="chip">Všetko</button>
        <button type="button" class="chip chip-on">Zmeny od Claude · 8</button>
        <button type="button" class="chip">Odoslané e-maily</button>
        <button type="button" class="chip">Zákazníci</button>
        <button type="button" class="chip">Prihlásenia</button>
        <button type="button" class="chip">Používateľ: všetci</button>
      </div>
      <section class="card" style="overflow: hidden">
        <div style="overflow-x: auto">
          <table>
            <thead><tr><th>Kedy</th><th>Kto</th><th>Čo urobil</th><th>Čoho sa týka</th><th>Odkiaľ</th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                <tr>
                  <td style="color: #48625f; white-space: nowrap">{{r.when}}</td>
                  <td><span class="claude"><i aria-hidden="true">C</i>{{r.who}}</span></td>
                  <td style="white-space: nowrap">{{r.action}}</td>
                  <td><a href="{{r.href}}" style="font-weight: 600">{{r.object}}</a><p style="margin: 0; font-size: 12px; color: #48625f">{{r.detail}}</p></td>
                  <td><span class="badge" style="background: #f7faf9; border: 1px solid #dfe8e6; color: #48625f">{{r.client}}</span></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Dnes 10:14', 'Claude za Janu Horváthovú', 'Pripravil koncept e-mailu', 'Rozpis zaškolenia pre ADOS Harmónia', 'čaká na kontrolu a odoslanie', 'SendPreview.dc.html', 'claude.ai'],
      ['Dnes 10:12', 'Claude za Janu Horváthovú', 'Uložil novú verziu', 'Cenová ponuka ADOS Harmónia 2027.docx', 'verzia 3 · Zákazníci / ADOS Harmónia', 'FileDetail.dc.html', 'claude.ai'],
      ['Dnes 10:09', 'Claude za Janu Horváthovú', 'Prečítal súbor', 'Harmonogram nástupu 2027.pdf', 'Zákazníci / ADOS Harmónia', 'FileDetail.dc.html', 'claude.ai'],
      ['Dnes 10:08', 'Claude za Janu Horváthovú', 'Prečítal zákazníka', 'ADOS Harmónia, s.r.o.', 'kontakty a časová os', 'CustomerDetail.dc.html', 'claude.ai'],
      ['Včera 17:40', 'Claude za Petra Kováča', 'Vytvoril súbor', 'Porovnanie cien 2026 a 2027.xlsx', 'Firemné dokumenty / Cenníky', 'FileDetail.dc.html', 'Claude Code · Notebook v kancelárii'],
      ['Včera 17:31', 'Claude za Petra Kováča', 'Prečítal súbor', 'Cenník Alma ADOS 2027.xlsx', 'Firemné dokumenty / Cenníky', 'FileDetail.dc.html', 'Claude Code · Notebook v kancelárii'],
      ['24. 10. 14:12', 'Claude za Petra Kováča', 'Uložil novú verziu', 'Cenová ponuka vzor 2027.docx', 'verzia 5 · Firemné dokumenty / Cenníky', 'FileDetail.dc.html', 'claude.ai'],
      ['24. 10. 14:05', 'Claude za Petra Kováča', 'Hľadal v súboroch', '„zľavy pre viac ako 15 sestier“', '3 výsledky', 'Files.dc.html', 'claude.ai']
    ].map((r) => ({ when: r[0], who: r[1], action: r[2], object: r[3], detail: r[4], href: r[5], client: r[6] }));
    return { rows };
  }
}
</script>
</body>
</html>
