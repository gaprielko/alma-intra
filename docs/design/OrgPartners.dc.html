<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Organizácie · Partneri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#152b2a;-webkit-font-smoothing:antialiased}
a{color:#0a6466;text-decoration:none}a:hover{color:#0c3b3c;text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{text-decoration:none}
.btn-primary{height:40px;padding:0 16px;font-size:14px;background:linear-gradient(180deg,#139698 0%,#0b6e70 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(12,59,60,.06),0 4px 12px rgba(12,59,60,.07)}
.btn-primary:hover{color:#fff}
.btn-icon{width:36px;height:36px;border:1px solid #d6e1de;background:#fff;color:#48625f}
.search{display:flex;align-items:center;gap:8px;height:40px;min-width:220px;padding:0 12px;border:1px solid #d6e1de;border-radius:10px;background:#fff;color:#6f8784;font-size:14px;box-sizing:border-box}
.kbd{margin-left:auto;font-size:11px;font-weight:600;color:#48625f;border:1px solid #d6e1de;border-radius:6px;padding:1px 6px;background:#f7faf9}
.tabs{display:flex;gap:4px;padding:0 28px;background:rgba(255,255,255,.8);border-bottom:1px solid #d6e1de}
.tab{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;font-size:14px;font-weight:600;color:#48625f;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#152b2a;text-decoration:none}
.tab-on{color:#0a6466;border-bottom-color:#0f8b8d}
.count{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:#dde6e3;color:#48625f}
.tab-on .count{background:#e3f3f2;color:#0a6466}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#f7faf9;border:1px solid #dfe8e6;font-size:12px;font-weight:500;color:#48625f;white-space:nowrap}
.card{border:1px solid #dfe8e6;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(12,59,60,.08),0 8px 22px rgba(12,59,60,.08)}
.filter{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 12px;border:1px solid #d6e1de;border-radius:10px;background:#fff;font:inherit;font-size:13px;font-weight:500;color:#152b2a;cursor:pointer;white-space:nowrap}
.filter-on{border-color:#0f8b8d;color:#0a6466;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
th{height:44px;padding:0 16px;background:#f7faf9;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5b7471;white-space:nowrap}
td{height:60px;padding:10px 16px;border-top:1px solid #dfe8e6;vertical-align:middle}
th:first-child,td:first-child{padding-left:20px;width:20px}
.muted{color:#48625f}
.sub{margin:2px 0 0;font-size:12px;color:#48625f;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.cb{width:18px;height:18px;accent-color:#0f8b8d;margin:0;cursor:pointer}
.sort{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;padding:0}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1040px; background: #eaf0ee">
  <div style="flex: 0 0 232px; background: #0c3b3c">
    <dc-import name="Sidebar" active="customers" organizations="{{ true }}" hint-size="232px,900px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0">
    <header style="min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 28px 8px; box-sizing: border-box; background: rgba(255,255,255,0.8)">
      <div style="flex: 1 1 auto; min-width: 0">
        <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">Organizácie</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: #48625f">Zákazníci, partneri a ich kontaktné osoby</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <div class="search"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Hľadať<span class="kbd">Ctrl K</span></div>
        <button type="button" class="btn btn-icon" aria-label="Upozornenia"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
        <a href="#" class="btn btn-primary"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nový partner</a>
      </div>
    </header>
    <nav class="tabs" aria-label="Organizácie">
      <a href="OrgCustomers.dc.html" class="tab">Zákazníci <span class="count">128</span></a>
      <a href="OrgPartners.dc.html" class="tab tab-on" aria-current="page">Partneri <span class="count">46</span></a>
      <a href="OrgContacts.dc.html" class="tab">Kontakty <span class="count">312</span></a>
    </nav>

    <div style="padding: 20px 28px 40px; max-width: 1400px">
      <section class="card" style="overflow: hidden">
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 20px 16px">
          <label style="flex: 1 1 320px; max-width: 420px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #d6e1de; border-radius: 10px; background: #fff; box-sizing: border-box">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6f8784" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Hľadať partnera</span>
            <input placeholder="Názov, IČO, meno alebo e-mail osoby" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 14px; color: #152b2a; background: transparent">
          </label>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <button type="button" class="filter">Druh<svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
            <button type="button" class="filter">Kraj<svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
            <button type="button" class="filter filter-on">Štítok: Dodávateľ<svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <button type="button" class="filter" style="margin-left: auto"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Uložené filtre</button>
        </div>

        <div style="overflow-x: auto">
          <table>
            <thead>
              <tr>
                <th><input type="checkbox" class="cb" aria-label="Vybrať všetkých na strane"></th>
                <th><button type="button" class="sort" style="color: #152b2a">Partner<svg aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></th>
                <th>Hlavný kontakt</th>
                <th>Štítky</th>
                <th><button type="button" class="sort">Posledný kontakt</button></th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
                <tr>
                  <td><input type="checkbox" class="cb" aria-label="Vybrať {{r.name}}"></td>
                  <td>
                    <div style="display: flex; align-items: center; gap: 12px">
                      <span class="avatar" style="{{r.avatarStyle}}">{{r.initials}}</span>
                      <div style="min-width: 0">
                        <a href="{{r.href}}" style="font-weight: 600; color: #152b2a; white-space: nowrap">{{r.name}}</a>
                        <p class="sub">{{r.meta}}</p>
                      </div>
                    </div>
                  </td>
                  <td>
                    <p style="margin: 0; white-space: nowrap">{{r.contact}}</p>
                    <p class="sub">{{r.email}}</p>
                  </td>
                  <td><div style="display: flex; gap: 4px; flex-wrap: wrap"><sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2"><span class="tag">{{t}}</span></sc-for></div></td>
                  <td class="muted" style="white-space: nowrap">{{r.last}}</td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <footer style="min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid #dfe8e6">
          <p style="margin: 0; font-size: 12px; color: #48625f">1–20 z 46 · 20 na stranu</p>
          <div style="display: flex; gap: 8px">
            <button type="button" class="btn btn-icon" aria-label="Predchádzajúca strana" disabled style="opacity: 0.5"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg></button>
            <button type="button" class="btn btn-icon" aria-label="Ďalšia strana"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"></path></svg></button>
          </div>
        </footer>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const avatars = [
      'background:#eeedfe;color:#3c3489', 'background:#eaf3de;color:#3b6d11', 'background:#faece7;color:#993c1d',
      'background:#e6f1fb;color:#0c447c', 'background:#faeeda;color:#854f0b', 'background:#fbeaf0;color:#993556', 'background:#e3f3f2;color:#0a6466'
    ];
    // [name, initials, meta, contact, e-mail, tags, last, private person]
    const data = [
      ['MediTech Slovakia, s.r.o.', 'MT', 'Bratislava', 'Ing. Tomáš Horák', 'horak@meditech.sk', ['Dodávateľ', 'zdravotnícke pomôcky'], '23. 10. 2026', false],
      ['Asociácia ADOS Slovenska', 'AA', 'Bratislava', 'Mgr. Lenka Šimková', 'simkova@asociacia-ados.sk', ['Inštitúcia'], '20. 10. 2026', false],
      ['Fakultná nemocnica L. Pasteura', 'FN', 'Košice', 'MUDr. Pavol Rusnák', 'rusnak@unlp.sk', ['Spolupracovník'], '17. 10. 2026', false],
      ['MUDr. Ján Kollár', 'JK', 'Prešov · Súkromná osoba', 'MUDr. Ján Kollár', 'kollar.jan@gmail.com', ['Konzultant'], '11. 10. 2026', true],
      ['Účtovníctvo Novák, s.r.o.', 'ÚN', 'Košice', 'Ing. Martina Nováková', 'novakova@uctovnictvo-novak.sk', ['Dodávateľ'], '30. 9. 2026', false],
      ['Vysoká škola zdravotníctva sv. Alžbety', 'VŠ', 'Bratislava', 'doc. PhDr. Mária Lenčová', 'lencova@vssvalzbety.sk', ['Inštitúcia', 'konferencia Košice'], '26. 9. 2026', false],
      ['Tlačiareň Graffis', 'TG', 'Prešov', 'Peter Mazur', 'objednavky@graffis.sk', ['Dodávateľ'], '8. 9. 2026', false],
      ['Mgr. Silvia Krajčovičová', 'SK', 'Trenčín · Súkromná osoba', 'Mgr. Silvia Krajčovičová', 'silvia.krajcovicova@gmail.com', ['Lektorka'], '2. 9. 2026', true],
      ['Nadácia Dobrý anjel', 'DA', 'Bratislava', 'Bez kontaktnej osoby', '', ['Inštitúcia'], '', false]
    ];
    const rows = data.map((d, i) => ({
      name: d[0], initials: d[1], meta: d[2],
      contact: d[7] ? '' : d[3], email: d[7] ? '' : d[4], tags: d[5], last: d[6],
      avatarStyle: avatars[i % avatars.length] + (d[7] ? ';border-radius:50%' : ''),
      href: 'OrgPartnerDetail.dc.html'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
